<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Miami</title>
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
    <script
      src="src/scripts/main.js"
      defer
    ></script>
  </head>
  <body>
    <div class="page-content">
      <header
        class="header"
        id="header"
      >
        <a
          href="#header"
          class="header__logo"
        >
          <img
            src="./src/images/bose-logo-icon.png"
            alt="bose-logo"
          />
        </a>

        <div class="header__actions">
          <a
            class="header__call"
            aria-label="Call us"
          >
            <img
              src="./src/images/call-icon.png"
              alt=""
            />
          </a>
          <button
            class="header__menu-toggle"
            aria-label="Open menu"
          >
            <img
              src="./src/images/menu-icon.png"
              alt=""
            />
          </button>
        </div>
      </header>
      <main class="main">
        <section class="hero">
          <img
            src="./src/images/sound-waves.png"
            alt=""
          />
          <h1 class="hero__title">
            <span class="hero__title-line">The world shades.</span>
            <span class="hero__title-line">Your music shines.</span>
          </h1>
        </section>
      </main>
    </div>
  </body>
</html>
